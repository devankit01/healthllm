name: Weekly HuggingFace Catalog Sync

on:
  schedule:
    # Every Monday at 09:00 UTC
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — print changes without writing files"
        type: boolean
        default: false
      limit:
        description: "Max results per search tag (default 200)"
        type: number
        default: 200

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run HuggingFace sync
        id: sync
        run: |
          set -euo pipefail
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="--dry-run"
          fi
          LIMIT="${{ inputs.limit }}"
          if [ -z "$LIMIT" ]; then
            LIMIT="200"
          fi

          python scripts/sync_hf.py $ARGS --limit "$LIMIT" > /tmp/sync_output.txt 2>&1
          cat /tmp/sync_output.txt

          # Write last-sync date so the footer can show it
          echo "{\"date\":\"$(date -u +%Y-%m-%d)\"}" > data/last-sync.json

          # Parse the counts printed by the script
          NEW_MODELS=$(grep "^SYNC_NEW_MODELS=" /tmp/sync_output.txt | cut -d= -f2 || echo "0")
          NEW_DATASETS=$(grep "^SYNC_NEW_DATASETS=" /tmp/sync_output.txt | cut -d= -f2 || echo "0")
          TOTAL_NEW=$(grep "^SYNC_TOTAL_NEW=" /tmp/sync_output.txt | cut -d= -f2 || echo "0")

          echo "new_models=${NEW_MODELS}"   >> "$GITHUB_OUTPUT"
          echo "new_datasets=${NEW_DATASETS}" >> "$GITHUB_OUTPUT"
          echo "total_new=${TOTAL_NEW}"     >> "$GITHUB_OUTPUT"

      - name: Skip if nothing new
        if: steps.sync.outputs.total_new == '0' || inputs.dry_run == true
        run: |
          echo "Nothing new to add (or dry run). Skipping PR creation."

      - name: Create pull request
        id: pr
        if: steps.sync.outputs.total_new != '0' && inputs.dry_run != true
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: "auto/catalog-sync-${{ github.run_number }}"
          base: main
          commit-message: |
            catalog: add ${{ steps.sync.outputs.new_models }} models + ${{ steps.sync.outputs.new_datasets }} datasets from HuggingFace
          title: "Weekly sync: ${{ steps.sync.outputs.new_models }} new models, ${{ steps.sync.outputs.new_datasets }} new datasets"
          body: |
            ## Automated HuggingFace catalog sync

            This PR was opened automatically by the [weekly-sync workflow](.github/workflows/weekly-sync.yml).

            | Catalog | New entries |
            |---------|------------|
            | Health LLMs (`data/health-models.json`) | ${{ steps.sync.outputs.new_models }} |
            | Datasets (`data/health-datasets.json`)  | ${{ steps.sync.outputs.new_datasets }} |

            ### Before merging

            - [ ] Skim the new entries — auto-generated `usecase` and `strength` fields may need a human polish
            - [ ] Check that `license` values look correct (some HuggingFace models don't publish a license)
            - [ ] Run `npm run check` locally (or wait for the CI check on this PR)
            - [ ] Remove any entries that are clearly not health-related (false positives from tag search)

            ---
            *Triggered by scheduled run on ${{ github.run_id }}*
          labels: "catalog-sync,automated"
          draft: false

      - name: Notify via GitHub Issue (triggers email to @devankit01)
        if: steps.sync.outputs.total_new != '0' && inputs.dry_run != true && steps.pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          WEEK=$(date -u +"%Y-%m-%d")
          PR_URL="${{ steps.pr.outputs.pull-request-url }}"
          NEW_MODELS="${{ steps.sync.outputs.new_models }}"
          NEW_DATASETS="${{ steps.sync.outputs.new_datasets }}"

          gh issue create \
            --repo "${{ github.repository }}" \
            --title "📬 Weekly catalog sync — ${WEEK}: ${NEW_MODELS} new models, ${NEW_DATASETS} new datasets" \
            --assignee "devankit01" \
            --label "catalog-sync,automated" \
            --body "## Weekly HuggingFace sync complete

          **Date:** ${WEEK}
          **New models added:** ${NEW_MODELS}
          **New datasets added:** ${NEW_DATASETS}

          ### Review the PR
          ${PR_URL}

          The PR contains auto-generated entries. Please:
          - Skim \`usecase\` and \`strength\` fields — they may need a light edit
          - Check any entries where \`license\` is \`unknown\`
          - Remove obvious false positives (non-health models caught by tag search)
          - Merge once CI passes

          ---
          *This issue was created automatically by the weekly-sync workflow. Close it after merging the PR.*"
